name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install compatible Corepack
        run: npm install --global corepack@0.34.2

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@11.1.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Resolve Astro Pages settings
        env:
          ASTRO_BASE_OVERRIDE: ${{ vars.ASTRO_BASE }}
          ASTRO_SITE_OVERRIDE: ${{ vars.ASTRO_SITE }}
          PUBLIC_API_URL_OVERRIDE: ${{ vars.PUBLIC_API_URL }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          default_base="/${repo_name}"

          if [ "${repo_name}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            default_base="/"
          fi

          {
            echo "ASTRO_DEPLOY_TARGET=github-pages"
            echo "ASTRO_SITE=${ASTRO_SITE_OVERRIDE:-https://${GITHUB_REPOSITORY_OWNER}.github.io}"
            echo "ASTRO_BASE=${ASTRO_BASE_OVERRIDE:-$default_base}"
          } >> "$GITHUB_ENV"

          if [ -n "$PUBLIC_API_URL_OVERRIDE" ]; then
            echo "PUBLIC_API_URL=$PUBLIC_API_URL_OVERRIDE" >> "$GITHUB_ENV"
          fi

      - name: Build web app
        run: |
          pnpm --filter @workspace-starter/ui build
          pnpm --filter @workspace-starter/i18n build
          pnpm --filter @workspace-starter/web build

      - name: Prepare Pages artifact
        run: touch apps/web/dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
