name: Build and Publish

# Publishes container images only when an operator starts this workflow from
# GitHub Actions. The selected ref is checked out, deployable apps are selected
# by their apps/<name>/Dockerfile convention, and images are pushed with both
# immutable git SHA and latest tags. Publishing never triggers a deployment.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or SHA to publish
        required: true
        default: main
        type: string
      apps:
        description: Comma-separated deployable apps to publish, or all
        required: true
        default: all
        type: string
      public_api_url:
        description: PUBLIC_API_URL embedded in frontend builds
        required: true
        type: string
      primary_frontend:
        description: Astro app served at / by web-host
        required: true
        default: web
        type: string

concurrency:
  group: build-publish-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  discover:
    name: Discover deployable apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_apps: ${{ steps.set.outputs.has_apps }}
      sha: ${{ steps.set.outputs.sha }}
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Select deployable apps
        id: set
        env:
          REQUESTED_APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail

          available=$(find apps -maxdepth 2 -name Dockerfile -printf '%h\n' | sed 's#apps/##' | sort)
          requested=$(printf '%s' "$REQUESTED_APPS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | sort -u)

          if [ "$REQUESTED_APPS" = "all" ]; then
            selected="$available"
          else
            invalid=$(comm -23 <(printf '%s\n' "$requested") <(printf '%s\n' "$available"))
            if [ -n "$invalid" ]; then
              echo "Unknown or non-deployable app(s): $invalid" >&2
              echo "Available apps: $(printf '%s' "$available" | paste -sd, -)" >&2
              exit 1
            fi
            selected="$requested"
          fi

          matrix=$(printf '%s\n' "$selected" | grep -v '^$' | jq -R . | jq -cs .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$selected" ]; then
            echo "has_apps=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Selected apps: ${selected:-none}"

  build:
    name: Build ${{ matrix.app }}
    needs: discover
    if: ${{ needs.discover.outputs.has_apps == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.sha }}

      - name: Resolve image
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            PUBLIC_API_URL=${{ inputs.public_api_url }}
            PRIMARY_FRONTEND=${{ inputs.primary_frontend }}
          secrets: |
            node_auth_token=${{ secrets.NODE_AUTH_TOKEN }}
          tags: |
            ${{ steps.image.outputs.image }}:${{ needs.discover.outputs.sha }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
