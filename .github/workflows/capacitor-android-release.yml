name: Capacitor Android Release

# Manual workflow to build Capacitor Android artifacts from Astro frontends.
# An app is mobile-capable iff it has apps/<name>/capacitor.config.ts.
#
# Debug APK builds work without secrets. Release AAB/APK builds require the
# Android signing secrets listed below.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Astro frontend app name
        required: true
        type: choice
        options:
          - web
          - secondary-web
      build_type:
        description: Android build variant
        required: true
        type: choice
        options:
          - debug
          - release
      release_format:
        description: Release artifact format (release builds only)
        required: true
        type: choice
        options:
          - aab
          - apk
      public_api_url:
        description: API URL baked into the mobile web build
        required: false
        type: string

concurrency:
  group: capacitor-android-${{ github.ref }}-${{ inputs.app }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android (${{ inputs.app }}, ${{ inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install compatible Corepack
        run: npm install --global corepack@0.34.2

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@11.1.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor web bundle
        env:
          PUBLIC_API_URL: ${{ inputs.public_api_url }}
        run: node scripts/capacitor/sync.mjs ${{ inputs.app }}

      - name: Ensure Android native project
        run: node scripts/capacitor/init-platforms.mjs ${{ inputs.app }} android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Android signing keystore
        if: ${{ inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release builds require ANDROID_KEYSTORE_BASE64 and related signing secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "apps/${{ inputs.app }}/android/release.keystore"

      - name: Write Android signing properties
        if: ${{ inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > "apps/${{ inputs.app }}/android/keystore.properties" <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: apps/${{ inputs.app }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release AAB
        if: ${{ inputs.build_type == 'release' && inputs.release_format == 'aab' }}
        working-directory: apps/${{ inputs.app }}/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Build release APK
        if: ${{ inputs.build_type == 'release' && inputs.release_format == 'apk' }}
        working-directory: apps/${{ inputs.app }}/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        if: ${{ inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-android-debug-apk
          path: apps/${{ inputs.app }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        if: ${{ inputs.build_type == 'release' && inputs.release_format == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-android-release-aab
          path: apps/${{ inputs.app }}/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release APK
        if: ${{ inputs.build_type == 'release' && inputs.release_format == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-android-release-apk
          path: apps/${{ inputs.app }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
