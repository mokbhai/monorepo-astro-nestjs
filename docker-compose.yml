services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template_jp
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d template_jp']
      interval: 5s
      timeout: 5s
      retries: 5

  web-host:
    build:
      context: .
      dockerfile: apps/web-host/Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      secrets:
        - node_auth_token
    environment:
      NODE_ENV: production
      PORT: 4321
      HOST: 0.0.0.0
      PRIMARY_FRONTEND: ${PRIMARY_FRONTEND:-web}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/template_jp?schema=public
    ports:
      - '${WEB_PORT:-4321}:4321'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN
