packages:
  - 'apps/*'
  - 'packages/*'

# Supply-chain buffer: never resolve a version published less than 7 days ago
# (10080 minutes). The days right after a release are the highest-risk window
# for a compromised package, so upgrades intentionally lag `latest` by a week.
minimumReleaseAge: 10080

# @jainparichay/* packages are our own published output, not a third-party
# supply-chain risk, so they are exempt from the release-age quarantine above.
minimumReleaseAgeExclude:
  - '@jainparichay/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

catalog:
  # React
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  react: ^19.2.8
  react-dom: ^19.2.8

  # TypeScript
  '@types/node': ^26.1.1
  # Held at 6.x on purpose: TypeScript 7 is the native (Go) compiler and ships
  # no JS compiler API, which @typescript-eslint (peer `>=4.8.4 <6.1.0`) and
  # @astrojs/check (peer `^5.0.0 || ^6.0.0`) both still require.
  typescript: ^6.0.3

  # tRPC
  '@trpc/server': ^11.18.0
  '@trpc/client': ^11.18.0
  '@trpc/react-query': ^11.18.0

  # Validation
  zod: ^4.4.3

  # Build
  tsup: ^8.5.1
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3

  # Testing
  vitest: ^4.1.10
  '@testing-library/jest-dom': ^7.0.0
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  jsdom: ^29.1.1

  openai: ^6.49.0

  prisma: ^7.9.0
  '@prisma/client': ^7.9.0
  '@prisma/adapter-pg': ^7.9.0
  pg: ^8.22.0

catalogs:
  dev-tools:
    eslint: ^10.8.0
    prettier: ^3.9.6
    prettier-plugin-astro: ^0.14.1
    '@typescript-eslint/eslint-plugin': ^8.65.0
    '@typescript-eslint/parser': ^8.65.0
